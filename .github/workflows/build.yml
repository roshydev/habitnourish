name: Build HabitNourish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v8
          restore-keys: buildozer-

      - name: Bootstrap Android SDK
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          # Download cmdline-tools only if not already cached
          if [ ! -f "$SDKMANAGER" ]; then
            echo "Downloading Android cmdline-tools..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools-extract /tmp/cmdline-tools.zip
          else
            echo "cmdline-tools already cached, skipping download."
          fi

          # Accept licenses
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true

          # Install required SDK components (idempotent — safe to re-run on cache hit)
          "$SDKMANAGER" --sdk_root="$SDK_DIR" \
            "build-tools;37.0.0" \
            "platforms;android-33" \
            "platform-tools"

          # Create the legacy tools/bin symlinks buildozer checks for
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/avdmanager"  "$SDK_DIR/tools/bin/avdmanager"

          # Verify aidl is present
          echo "=== Installed build-tools ==="
          ls "$SDK_DIR/build-tools/"
          echo "=== aidl path ==="
          find "$SDK_DIR/build-tools" -name aidl

      - name: Build APK
        run: |
          # Java 17
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          # Pin python3 to the setup-python 3.10 binary so python-for-android
          # does not pick up the system python (3.14 on this runner image),
          # which would produce a pip version mismatch (ImportError:
          # cannot import name 'BuildDependencyInstallError').
          export PATH="$(python3 -c 'import sys,os; print(os.path.dirname(sys.executable))'):$PATH"
          echo "Java:   $(java -version 2>&1 | head -1)"
          echo "Python: $(python3 --version)"

          # Remove any stale venv left by a previously failed/cached build.
          # A venv created by the wrong Python version will always fail.
          rm -rf ~/.buildozer/android/platform/build-*/build/venv

          buildozer -v android debug 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED — last 150 log lines ==="
            find . -name "*.log" | xargs tail -150 2>/dev/null || true
            exit $BUILD_EXIT
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitNourish-debug.apk
          path: bin/*.apk
