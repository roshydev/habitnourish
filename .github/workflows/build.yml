name: Build HabitNourish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v5
          restore-keys: buildozer-

      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH

          # Ensure the python3 on PATH is the one set up by actions/setup-python (3.10),
          # not any system python that could be 3.14+. This prevents python-for-android
          # from creating a venv with a mismatched pip version (ImportError on
          # BuildDependencyInstallError).
          export PATH="$(python3 -c 'import sys, os; print(os.path.dirname(sys.executable))'):$PATH"
          echo "Using python: $(which python3) -> $(python3 --version)"

          # Remove any stale venv from a previous failed build that may be cached
          rm -rf ~/.buildozer/android/platform/build-*/build/venv

          buildozer -v android debug 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            echo "=== Last 150 lines of buildozer log ==="
            find . -name "*.log" | xargs tail -150 2>/dev/null || true
            exit $BUILD_EXIT
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitNourish-debug.apk
          path: bin/*.apk
